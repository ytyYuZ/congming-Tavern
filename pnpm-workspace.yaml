# SmartTavern pnpm workspaces (M0-T0)
# Layout mirrors docs/02-技术架构.md §3 代码组织（pnpm workspaces）.

packages:
  # UI shells: the only place DOM/browser/Tauri APIs are allowed.
  - "apps/*"

  # Packages in dependency order (schema ← core ← the rest).
  #   schema     # frozen contracts: Zod entities + JSON Schema export + migrations
  #   core       # domain + engines, NO DOM, NO concrete providers
  #   providers  # LLM / image provider adapters
  #   storage    # IndexedDB / SQLite / AssetStore implementations
  #   rules      # dice, checks, retrieval, built-in rule-pack data
  #   packages   # .stpack pack / unpack / validate (pure logic)
  #   importers  # SillyTavern / Risu / Tavern import + export
  #   ui         # shared presentational components (no business logic)
  #   i18n       # message catalogs + locale plumbing
  - "packages/*"

  # Developer tooling and build scripts.
  - "tools/*"

# Vite 8 depends on esbuild, whose postinstall links its platform binary. pnpm blocks
# dependency build scripts by default and treats "ignored builds" as a HARD ERROR, which
# makes `pnpm install` exit 1 — and because every `pnpm run` performs a dependency check
# first, that error then blocks lint/typecheck/test as well.
#
# The shape is a MAP of package -> boolean; a list is rejected outright, and pnpm's own
# placeholder value ("set this to true or false") is a string, which counts as "not
# approved". Keyed by package name so the entry does not rot on an esbuild upgrade.
allowBuilds:
  esbuild: true

# ── pnpm settings (pnpm 12 reads these from THIS file, not from .npmrc) ───────
# `cacheDir` and `storeDir` live here rather than in .npmrc: pnpm 12 only honours
# them in this file. Both point inside the workspace because some developer hosts
# (and CI sandboxes) deny writes to the user-level pnpm/npm directories.
cacheDir: .npm-cache

# Hoisted linker, deliberately — see the comment block in .npmrc for the reason
# and the cost. Mirrored here because pnpm 12 reads settings from this file while
# pnpm 11 reads them from .npmrc; keeping both in sync keeps one tree shape.
nodeLinker: hoisted

# Only materialise optional native binaries for the platform we are actually on.
# esbuild, rollup and rolldown each publish a dozen per-OS/per-CPU packages; without
# this, every install tries to fetch all of them (android, win32-ia32, every linux
# libc variant), which is slow everywhere and fails outright on restricted networks.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

# Do NOT let `pnpm run`/`pnpm test`/`pnpm exec` run a dependency check that performs an
# install first. On a host that denies spawned child processes, the approved esbuild
# postinstall then crashes the check with `spawn EPERM`, which fails every script before
# it starts (lint/typecheck/test alike) even though the tree is complete. CI installs
# explicitly, so it never needs this check either.
verifyDepsBeforeRun: false
