# SmartTavern CI — M0-T0 item 4.
#
# Documented rule (HANDOFF §5 M0-T0, docs/06-开发任务拆解.md §0.1):
#   lint → typecheck → test → build → rust, all five green before a merge is allowed.
#
# The jobs are chained with `needs:` so the order is real, not cosmetic —
# a red lint stops the pipeline immediately (and GitHub branch protection can
# require the single `ci` gate job below).
#
# No secrets and no hosted services are needed. Two jobs do use the network, and
# both only READ: `install` resolves the pnpm store, and `rust` resolves crates
# from crates.io (the lockfile pins them).
# ACTIONS MUST STAY ON node24-CAPABLE MAJORS.
# GitHub removed Node 20 from the runners and now forces these actions onto Node
# 24, which prints a deprecation notice on every run. checkout@v5, setup-node@v5
# and pnpm/action-setup@v5 are the first majors that declare `using: node24`, so
# they are the floor here: pinning back to v4 brings the notice back.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  # Keep the toolchain honest in CI too: pnpm must not run lifecycle scripts it
  # did not have to run locally.
  NODE_ENV: development

# NOTE on Node: `.nvmrc` pins the CI runtime. Nothing OS-specific lives in this
# file: pnpm settings (cacheDir / overrides) come from the tracked
# pnpm-workspace.yaml, and Linux runners need no workaround from .npmrc.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          # The dependency-direction check parses sources, so line endings and
          # permissions must match the committed bytes on every platform.
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: install
        # pnpm settings come from the tracked pnpm-workspace.yaml; no
        # OS-specific workaround is needed on Linux runners.
        run: pnpm install --frozen-lockfile

      - name: biome check + dependency-direction check
        # `pnpm lint` = `biome check .` AND `node tools/scripts/check-dependency-direction.mjs`
        # (see package.json). Both halves of M0-T0 item 5: the lint rules that
        # fail fast in the editor, and the import-graph walk that also catches
        # deep imports and brand-new packages.
        run: pnpm lint

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.6.0
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: install
        run: pnpm install --frozen-lockfile
      - name: tsc -b (strict + noUncheckedIndexedAccess, packages/core is DOM-free)
        run: pnpm typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.6.0
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: install
        run: pnpm install --frozen-lockfile
      - name: vitest (all workspaces, including the dependency-direction tests)
        run: pnpm test

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.6.0
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: install
        run: pnpm install --frozen-lockfile
      - name: vite build (apps/web, apps/desktop)
        run: pnpm build

  # Rust is the fifth job (added 2026-10, A 步). `cargo fmt --check` + `clippy -D warnings` +
  # `cargo test` on the Tauri shell used to be a MANUAL gate (`tauri:check`), because a cold
  # build of the whole `tauri` tree costs minutes of runner time. That trade-off is now accepted:
  # the shell is shipped code, and the transport bugs it has caught were invisible to the TS jobs.
  #
  # WHAT MAKES IT POSSIBLE, IN ORDER
  # 1. the Linux system libraries Tauri's build script links against (apt below);
  # 2. the SAME Rust version as the development machine — the pin lives in this step because the
  #    repo has no `rust-toolchain.toml`, and a floating stable would move fmt/clippy diagnostics;
  # 3. `apps/desktop/dist` MUST exist before cargo runs: `lib.rs` embeds the frontend through
  #    `tauri::generate_context!` at COMPILE time, so `cargo test` on a tree without a built
  #    frontend fails with a missing-`frontendDist` error that has nothing to do with Rust.
  rust:
    name: rust
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: install
        run: pnpm install --frozen-lockfile

      - name: tauri system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev

      - name: pin the Rust version the shell is checked with
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version

      - name: build the shell's frontend bundle (embedded at compile time)
        run: pnpm --filter @smarttavern/desktop build

      - name: cargo fmt --check, clippy -D warnings, cargo test
        run: pnpm --filter @smarttavern/desktop tauri:check

  # Single required status check for branch protection: "all five are green".
  gate:
    name: ci
    needs: [lint, typecheck, test, build, rust]
    runs-on: ubuntu-latest
    steps:
      - name: all five jobs are green
        run: echo "lint, typecheck, test, build and rust all passed — merge is allowed."
